version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    command: npm run dev || node src/server.js
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/playable_ads
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secure-jwt-secret-key-2024-playable-ads-saas
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: node src/workers/renderWorker.js
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./node_modules:/app/node_modules
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/playable_ads
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secure-jwt-secret-key-2024-playable-ads-saas
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: playable_ads
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d playable_ads"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: